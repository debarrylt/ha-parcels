# Example Parcels dashboard. Add it in Settings > Dashboards > (new dashboard) > raw configuration editor, or paste a
# view into an existing dashboard. Only core Home Assistant cards are used (tile, markdown, heading, grid).
# One section per row slot (sensor.parcels_slot_N, ordered: delivered-to-confirm, flagged, then by ETA); a slot shows
# only while a parcel occupies it. Tapping a parcel opens its detail view (subviews parcel-1..8 at the end of the file;
# the navigation path assumes the dashboard URL /dashboard-parcels, change it to yours).
# The to-do list at the bottom holds every parcel: tick = received; add one by hand with "tracking: <number>" in the
# description.
title: Parcels
views:
  - title: Parcels
    path: parcels
    icon: mdi:package-variant-closed
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Deliveries
            icon: mdi:truck-delivery-outline
          - type: tile
            entity: sensor.parcels_in_flight
            name: On the way
            icon: mdi:truck-fast-outline
            color: blue
            grid_options: {columns: 6}
            tap_action: {action: none}
          - type: tile
            entity: sensor.parcels_in_flight
            name: Arriving today
            icon: mdi:calendar-today
            color: teal
            state_content: arriving_today
            grid_options: {columns: 6}
            tap_action: {action: none}
          - type: tile
            entity: sensor.parcels_in_flight
            name: To confirm
            icon: mdi:package-variant-closed-check
            color: green
            state_content: delivered_to_confirm
            grid_options: {columns: 6}
            tap_action: {action: none}
          - type: tile
            entity: sensor.parcels_in_flight
            name: To follow up
            icon: mdi:flag-outline
            color: orange
            state_content: follow_up
            grid_options: {columns: 6}
            tap_action: {action: none}
          - type: markdown
            text_only: true
            content: >-
              {% set a = (states.sensor.parcels_in_flight.attributes if states.sensor.parcels_in_flight else {}) %}
              {% if states('sensor.parcels_in_flight') | int(0) == 0 %}Nothing on the way.{% endif %}
              {% if a.get('details_pending') %}<ha-alert alert-type="info">{{ a.get('details_pending') }} waiting for details: the AI is {{ 'busy' if is_state('binary_sensor.parcels_ai_online', 'on') else 'offline' }}.</ha-alert>{% endif %}
              {% if a.get('last_error') %}<ha-alert alert-type="error">{{ a.get('last_error') }}</ha-alert>{% endif %}
              {% if a.get('more') %}{{ a.get('more') }} more in the list below.{% endif %}
              Mail checked {{ as_timestamp(a.get('last_scan'), 0) | timestamp_custom('%H:%M') }}
          - type: tile
            entity: sensor.parcels_in_flight
            name: Check mail now
            icon: mdi:email-sync-outline
            color: primary
            hide_state: true
            grid_options: {columns: 12}
            tap_action:
              action: perform-action
              perform_action: parcels.scan
      - type: grid
        cards:
          - type: tile
            entity: sensor.parcels_slot_1
            name: Parcel 1
            grid_options: {columns: 12}
            tap_action: {action: navigate, navigation_path: /dashboard-parcels/parcel-1}
          - type: markdown
            text_only: true
            content: >-
              {% set a = (states.sensor.parcels_slot_1.attributes if states.sensor.parcels_slot_1 else {}) %}
              {{ a.get('status') }} · {{ a.get('eta') or 'no date yet' }}{{ ' · ' ~ a.get('carrier') if a.get('carrier') }}
              {% if a.get('last_event') %}<br>{{ a.get('last_event') }}{% endif %}
              {% if a.get('flagged') %}<br>Follow up: {{ a.get('flag_reason') }}{% endif %}
              {% if a.get('url') %}<br>[{{ a.get('tracking') or 'Track' }}]({{ a.get('url') }}){% endif %}
          - type: horizontal-stack
            cards:
              - type: tile
                entity: button.parcels_slot_1_received
                name: Received
                icon: mdi:check-circle-outline
                color: green
                hide_state: true
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target: {entity_id: button.parcels_slot_1_received}
              - type: tile
                entity: button.parcels_slot_1_follow_up
                name: Follow up
                icon: mdi:flag-outline
                color: orange
                hide_state: true
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target: {entity_id: button.parcels_slot_1_follow_up}
        visibility:
          - condition: state
            entity: sensor.parcels_slot_1
            state_not: none
