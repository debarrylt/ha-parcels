  - title: Parcel 1
    path: parcel-1
    subview: true
    type: sections
    sections:
      - type: grid
        cards:
          - type: markdown
            title: "{{ states('sensor.parcels_slot_1') }}"
            content: >-
              {% set a = (states.sensor.parcels_slot_1.attributes if states.sensor.parcels_slot_1 else {}) %}
              **Status:** {{ a.get('status') }}<br>
              **Expected:** {{ a.get('eta') or 'unknown' }}<br>
              **Carrier:** {{ a.get('carrier') or 'unknown' }}<br>
              **Merchant:** {{ a.get('merchant') or 'unknown' }}<br>
              **Order:** {{ a.get('order') or '-' }}<br>
              **Tracking:** {{ a.get('tracking_numbers', []) | join(', ') or '-' }}<br>
              {% if a.get('location') %}**Last location:** {{ a.get('location') }}<br>{% endif %}
              {% if a.get('last_event') %}**Last carrier event:** {{ a.get('last_event') }}<br>{% endif %}
              {% if a.get('t17_url') %}[17TRACK]({{ a.get('t17_url') }}){% endif %}
              {% if a.get('carrier_url') %} · [Carrier page]({{ a.get('carrier_url') }}){% endif %}
              {% if a.get('order_url') %} · [Order page]({{ a.get('order_url') }}){% endif %}
          - type: markdown
            title: Emails
            content: >-
              {% set a = (states.sensor.parcels_slot_1.attributes if states.sensor.parcels_slot_1 else {}) %}
              {% for e in a.get('emails', []) %}- {{ (e.date or '')[:10] }} {{ e.subject }}{% if e.note %}: {{ e.note }}{% endif %}
              {% endfor %}
