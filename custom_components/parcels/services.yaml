received:
  fields:
    parcel_id: {example: "a1b2c3d4", selector: {text: {}}}
    slot: {example: 1, selector: {number: {min: 1, max: 99, mode: box}}}
    received: {default: true, selector: {boolean: {}}}
follow_up:
  fields:
    parcel_id: {selector: {text: {}}}
    slot: {selector: {number: {min: 1, max: 99, mode: box}}}
    flag: {selector: {boolean: {}}}
    reason: {example: "Misdelivered / investigating", selector: {text: {}}}
merge:
  fields:
    parcel_id: {required: true, selector: {text: {}}}
    into: {required: true, selector: {text: {}}}
remove:
  fields:
    parcel_id: {selector: {text: {}}}
    slot: {selector: {number: {min: 1, max: 99, mode: box}}}
add_tracking:
  fields:
    parcel_id: {selector: {text: {}}}
    slot: {selector: {number: {min: 1, max: 99, mode: box}}}
    tracking: {required: true, example: "H09XYZ0000000042", selector: {text: {}}}
scan:
delivered:
  fields:
    since: {example: "2026-11-01T00:00:00+00:00", selector: {datetime: {}}}
reload_rules:
test_email:
  fields:
    subject: {required: true, example: "Your parcel is out for delivery", selector: {text: {}}}
    sender: {required: true, example: "do-not-reply@evri.com", selector: {text: {}}}
    body: {required: true, example: "Tracking number: H09XYZ0000000042", selector: {text: {multiline: true}}}
    date: {example: "2026-11-05T14:27:00+00:00", selector: {datetime: {}}}
